{% extends "base.html" %}

{% block title %}Edit Tag{% endblock %}

{% block content %}
<section class="admin-panel">
    <p class="label">Admin tags</p>
    <h1>Edit tag</h1>
    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}
    <form class="admin-form" method="post" action="{{ url_for('admin.edit_tag_post', tag_id=tag.id) }}">
        <label>
            <span>Tag name</span>
            <input type="text" name="name" value="{{ tag.name }}" required>
        </label>
        <div class="admin-actions">
            <button type="submit">Save tag</button>
            <a href="{{ url_for('admin.admin_tags') }}">Back to tags</a>
        </div>
    </form>
</section>
{% endblock %}
