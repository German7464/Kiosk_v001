<article class="admin-event-preview admin-event-preview--{{ preview_mode }} admin-event-preview--{{ preview_size }}" data-admin-preview data-preview-label="{{ preview_label|e }}" data-preview-mode="{{ preview_mode }}" data-preview-title="{{ preview_title|e }}" data-preview-date="{{ preview_date|e }}" data-preview-place="{{ preview_place|e }}" data-preview-description="{{ preview_description|e }}" data-preview-image="{{ preview_image|e }}">
    <p class="admin-event-preview__label">{{ preview_label }}</p>
    <div class="admin-event-preview__media" data-admin-preview-media data-placeholder="{{ t('common.image_area') }}">
        {% if preview_image %}
        <img src="{{ preview_image }}" alt="{{ preview_title }}">
        {% else %}
        <span class="admin-event-preview__placeholder">{{ t("common.image_area") }}</span>
        {% endif %}
    </div>
    <div class="admin-event-preview__text">
        <p class="event-date admin-event-preview__date" data-form-preview-date>{{ preview_date }}</p>
        <h3 class="admin-event-preview__title" data-form-preview-title>{{ preview_title }}</h3>
        <p class="admin-event-preview__description" data-form-preview-description>{{ preview_description }}</p>
        <p class="event-place admin-event-preview__place" data-form-preview-place>{{ preview_place }}</p>
    </div>
    <button class="admin-event-preview__open" type="button" data-admin-preview-open>{{ t("admin.open_preview") }}</button>
</article>
