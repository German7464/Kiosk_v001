{% extends "base.html" %}

{% block title %}{{ t("admin.change_password") }}{% endblock %}

{% block content %}
<section class="admin-panel">
    <p class="label">{{ t("admin.security") }}</p>
    <h1>{{ t("admin.change_password") }}</h1>
    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}
    <form class="admin-form" method="post" action="{{ url_for('admin.change_password_post') }}">
        <label>
            <span>{{ t("admin.current_password") }}</span>
            <input type="password" name="current_password" autocomplete="current-password" required>
        </label>
        <label>
            <span>{{ t("admin.new_password") }}</span>
            <input type="password" name="new_password" autocomplete="new-password" required>
        </label>
        <label>
            <span>{{ t("admin.confirm_new_password") }}</span>
            <input type="password" name="confirm_password" autocomplete="new-password" required>
        </label>
        <div class="admin-actions">
            <button type="submit">{{ t("admin.save_password") }}</button>
            <a href="{{ url_for('admin.admin_home') }}">{{ t("common.back_to_admin") }}</a>
        </div>
    </form>
</section>
{% endblock %}
