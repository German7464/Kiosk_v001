{% extends "base.html" %}

{% block title %}Event Tags{% endblock %}

{% block content %}
<section class="admin-panel admin-panel-wide">
    <p class="label">Admin event tags</p>
    <h1>{{ event.title }}</h1>
    <form class="admin-form" method="post" action="{{ url_for('admin.edit_event_tags_post', event_id=event.id) }}">
        {% if tags %}
        <div class="admin-checkbox-list">
            {% for tag in tags %}
            <label>
                <input type="checkbox" name="tag_ids" value="{{ tag.id }}" {% if tag.id in assigned_tag_ids %}checked{% endif %}>
                <span>{{ tag.name }}</span>
            </label>
            {% endfor %}
        </div>
        {% else %}
        <p class="admin-copy">No tags have been created yet.</p>
        {% endif %}
        <div class="admin-actions">
            <button type="submit">Save event tags</button>
            <a href="{{ url_for('admin.admin_events') }}">Back to events</a>
            <a href="{{ url_for('admin.admin_tags') }}">Manage tags</a>
        </div>
    </form>
</section>
{% endblock %}
