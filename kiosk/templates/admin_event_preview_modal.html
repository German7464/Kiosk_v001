<div class="admin-event-preview-modal" data-admin-preview-modal hidden>
    <div class="admin-event-preview-modal__panel" role="dialog" aria-modal="true" aria-labelledby="{{ preview_modal_title_id }}">
        <div class="admin-event-preview-modal__header">
            <p class="label" data-admin-preview-modal-mode>{{ t("admin.event_preview") }}</p>
            <button class="close-button" type="button" data-admin-preview-close>{{ t("common.close") }}</button>
        </div>
        <div class="admin-event-preview-modal__card" data-admin-preview-modal-card>
            <div class="admin-event-preview-modal__media" data-admin-preview-modal-image data-admin-preview-media data-placeholder="{{ t('common.image_area') }}">
                <span class="admin-event-preview__placeholder">{{ t("common.image_area") }}</span>
            </div>
            <div class="admin-event-preview-modal__text">
                <p class="event-date" data-admin-preview-modal-date></p>
                <h2 id="{{ preview_modal_title_id }}" data-admin-preview-modal-title></h2>
                <p data-admin-preview-modal-description></p>
                <p class="event-place" data-admin-preview-modal-place></p>
            </div>
        </div>
    </div>
</div>
