{% extends "base.html" %}

{% block title %}{{ t("admin.system_settings") }}{% endblock %}

{% block content %}
<section class="admin-panel">
    <p class="label">{{ t("admin.settings") }}</p>
    <h1>{{ t("admin.system_settings") }}</h1>
    {% if error %}
    <p class="form-error">{{ error }}</p>
    {% endif %}
    <form class="admin-form" method="post" action="{{ url_for('admin.save_admin_settings') }}" enctype="multipart/form-data">
        {% if settings.site_icon %}
        <div class="admin-icon-preview">
            <img src="{{ settings.site_icon }}" alt="{{ settings.site_title }}">
        </div>
        {% endif %}
        <label>
            <span>{{ t("admin.system_title") }}</span>
            <input type="text" name="site_title" value="{{ settings.site_title }}" required>
        </label>
        <label>
            <span>{{ t("admin.interface_language") }}</span>
            <select name="interface_language">
                <option value="ru" {% if settings.interface_language == "ru" %}selected{% endif %}>ru</option>
                <option value="en" {% if settings.interface_language == "en" %}selected{% endif %}>en</option>
                <option value="de" {% if settings.interface_language == "de" %}selected{% endif %}>de</option>
            </select>
        </label>
        <label>
            <span>{{ t("admin.system_icon") }}</span>
            <input type="file" name="site_icon" accept="image/*">
        </label>
        <div class="admin-actions">
            <button type="submit">{{ t("admin.save_settings") }}</button>
            <a href="{{ url_for('admin.admin_home') }}">{{ t("common.back_to_admin") }}</a>
        </div>
    </form>
</section>
{% endblock %}
